/* Convierte cada plato [nombre, precio, desc, foto] en objeto */
Object.values(categories).forEach(c => {
  c.products = c.products.map(([name, price, description = "", image = ""]) => ({ name, price, description, image }));
});

/* ---------- Elementos ---------- */
const $ = id => document.getElementById(id);
const categoriesPage = $("categoriesPage"), categoryPage = $("categoryPage"), productsGrid = $("productsGrid"),
      productSearch = $("productSearch"), productModal = $("productModal"), productQuantity = $("productQuantity"),
      cartPanel = $("cartPanel"), cartOverlay = $("cartOverlay"), cartItems = $("cartItems");

let currentCategory = null, currentProduct = null, currentQuantity = 1, cart = [];
try { cart = JSON.parse(localStorage.getItem("monteroCarrito")) || []; } catch (e) { cart = []; }

/* ---------- Tarjetas de categorías ---------- */
Object.entries(categories).forEach(([id, c]) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "category-card" + (c.wide ? " promo-card" : "");
  b.innerHTML = `<span class="category-icon">${ICONS[id]}</span>
    <span class="category-name">${c.label || c.title}</span>
    <span class="category-arrow"><i class="fa-solid fa-arrow-right"></i></span>`;
  b.addEventListener("click", () => openCategory(id));
  $("categoriesGrid").appendChild(b);
});

/* ---------- Categoría y productos ---------- */
function openCategory(id) {
  const c = categories[id];
  if (!c) return;
  currentCategory = id;
  $("categoryPageTitle").textContent = c.title;
  $("categoryPageSubtitle").textContent = c.subtitle;
  $("categoryPageIcon").innerHTML = ICONS[id];
  productSearch.value = "";
  renderProducts(c.products);
  categoriesPage.hidden = true;
  categoryPage.hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeCategory() {
  categoryPage.hidden = true;
  categoriesPage.hidden = false;
  currentCategory = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderProducts(list) {
  productsGrid.innerHTML = "";
  if (!list.length) {
    productsGrid.innerHTML = `<div class="no-products"><i class="fa-solid fa-utensils"></i><h3>No encontramos productos</h3><p>Intenta con otra búsqueda.</p></div>`;
    return;
  }
  list.forEach(p => {
    const card = document.createElement("article");
    card.className = "product-card";
    card.innerHTML = `
      ${p.image ? `<div class="product-image"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>` : ""}
      <div class="product-information">
        <span class="product-category-label">${categories[currentCategory].title}</span>
        <h3>${p.name}</h3>
        ${p.description ? `<p>${p.description}</p>` : ""}
        <div class="product-card-bottom">
          <strong>S/ ${p.price.toFixed(2)}</strong>
          <button type="button" class="product-view-button">VER <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>`;
    card.querySelector("button").addEventListener("click", () => openProductModal(p));
    productsGrid.appendChild(card);
  });
}

productSearch.addEventListener("input", () => {
  if (!currentCategory) return;
  const q = productSearch.value.toLowerCase().trim();
  renderProducts(categories[currentCategory].products.filter(p =>
    p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)));
});

/* ---------- Ventana del producto ---------- */
function openProductModal(p) {
  currentProduct = { ...p, cat: currentCategory };
  currentQuantity = 1;
  productQuantity.textContent = 1;
  $("modalProductCategory").textContent = categories[currentCategory].title;
  $("modalProductName").textContent = p.name;
  $("modalProductDescription").textContent = p.description;
  $("modalProductDescription").hidden = !p.description;
  $("modalProductPrice").textContent = `S/ ${p.price.toFixed(2)}`;
  const img = $("modalProductImage");
  if (p.image) { img.src = p.image; img.alt = p.name; img.style.display = "block"; }
  else { img.removeAttribute("src"); img.style.display = "none"; }
  productModal.hidden = false;
  document.body.classList.add("modal-open");
}

function closeProductModal() {
  productModal.hidden = true;
  currentProduct = null;
  document.body.classList.remove("modal-open");
}

$("increaseQuantity").addEventListener("click", () => { productQuantity.textContent = ++currentQuantity; });
$("decreaseQuantity").addEventListener("click", () => { if (currentQuantity > 1) productQuantity.textContent = --currentQuantity; });

$("addProductButton").addEventListener("click", () => {
  if (!currentProduct) return;
  const key = currentProduct.cat + "|" + currentProduct.name;
  const found = cart.find(i => i.key === key);
  if (found) found.quantity += currentQuantity;
  else cart.push({ key, name: currentProduct.name, price: currentProduct.price, quantity: currentQuantity });
  updateCart();
  closeProductModal();
  openCart();
});

/* ---------- Carrito ---------- */
function updateCart() {
  try { localStorage.setItem("monteroCarrito", JSON.stringify(cart)); } catch (e) {}
  const units = cart.reduce((t, i) => t + i.quantity, 0);
  const total = cart.reduce((t, i) => t + i.price * i.quantity, 0);
  $("cartCount").textContent = units;
  $("cartTotal").textContent = `S/ ${total.toFixed(2)}`;

  cartItems.innerHTML = cart.length ? cart.map((i, n) => `
    <div class="cart-item">
      <div class="cart-item-information"><h3>${i.name}</h3><span>S/ ${i.price.toFixed(2)}</span></div>
      <div class="cart-item-controls">
        <button type="button" data-action="decrease" data-index="${n}">-</button>
        <strong>${i.quantity}</strong>
        <button type="button" data-action="increase" data-index="${n}">+</button>
      </div>
      <button type="button" class="remove-cart-item" data-action="remove" data-index="${n}" aria-label="Eliminar"><i class="fa-solid fa-trash"></i></button>
    </div>`).join("")
  : `<div class="empty-cart"><i class="fa-solid fa-cart-shopping"></i><h3>Tu pedido está vacío</h3><p>Agrega tus platos favoritos.</p></div>`;

  let msg = "Hola, quisiera realizar un pedido en Cevichería Montero.";
  if (cart.length) {
    msg = "Hola, quiero realizar el siguiente pedido en Cevichería Montero:\n\n" +
      cart.map(i => `• ${i.quantity} x ${i.name} - S/ ${(i.price * i.quantity).toFixed(2)}`).join("\n") +
      `\n\nTotal: S/ ${total.toFixed(2)}`;
  }
  $("whatsappButtonOne").href = `https://wa.me/${PHONES[0]}?text=${encodeURIComponent(msg)}`;
  $("whatsappButtonTwo").href = `https://wa.me/${PHONES[1]}?text=${encodeURIComponent(msg)}`;
}

cartItems.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const n = Number(b.dataset.index), a = b.dataset.action;
  if (a === "increase") cart[n].quantity++;
  else if (a === "decrease") { if (--cart[n].quantity <= 0) cart.splice(n, 1); }
  else cart.splice(n, 1);
  updateCart();
});

function openCart() {
  cartPanel.classList.add("active");
  cartOverlay.hidden = false;
  cartPanel.setAttribute("aria-hidden", "false");
  document.body.classList.add("cart-open");
}
function closeCart() {
  cartPanel.classList.remove("active");
  cartOverlay.hidden = true;
  cartPanel.setAttribute("aria-hidden", "true");
  document.body.classList.remove("cart-open");
}

/* ---------- Eventos generales ---------- */
$("openCartButton").addEventListener("click", openCart);
$("closeCartButton").addEventListener("click", closeCart);
cartOverlay.addEventListener("click", closeCart);
$("closeProductModal").addEventListener("click", closeProductModal);
$("productModalOverlay").addEventListener("click", closeProductModal);
$("backToCategories").addEventListener("click", closeCategory);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!productModal.hidden) closeProductModal();
  if (cartPanel.classList.contains("active")) closeCart();
});

updateCart();
</script>
</body>
</html>
